# Alembic configuration.
#
# Note what is absent: sqlalchemy.url. The database URL lives in the environment
# and is read by migrations/env.py through app.config, so there is exactly one
# place it is defined and no way for a migration to be applied to a different
# database than the app talks to.

[alembic]
script_location = migrations
prepend_sys_path = .

# Timestamped, readable filenames. The default is a bare hex slug, which makes a
# directory listing useless for answering "what changed and when".
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
