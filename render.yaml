# Render Blueprint — creates the API service and its Postgres in one shot.
#
#   Render Dashboard → New → Blueprint → pick this repo.
#
# Three variables are marked `sync: false`, which means Render will prompt you
# for them at deploy time instead of storing them here. That is deliberate:
# BOT_TOKEN is the HMAC key for initData validation, and it must never be
# committed to a repository.

databases:
  - name: sga-db
    plan: free
    databaseName: sga
    user: sga

services:
  - type: web
    name: sga-api
    runtime: python
    plan: free

    # Both commands are written relative to the repository root and do their own
    # directory changes. `rootDir: backend` would be the tidier way to say this,
    # but it is not reliably applied to an already-created service, which fails
    # as a confusing "requirements.txt not found in /opt/render/project/src".
    # Being explicit costs one `cd` and removes the ambiguity entirely.
    #
    # The `cd` in startCommand is load-bearing: uvicorn resolves `app.main` from
    # the current working directory, so it must run inside backend/.
    buildCommand: pip install -r backend/requirements.txt

    # Migrations run here rather than in buildCommand or in the app's lifespan.
    #
    # Not the build, because Render's build step cannot reach the internal
    # database URL. Not the lifespan, because that puts schema changes inside
    # every worker's startup — fine at one worker, a race at two.
    #
    # The `&&` matters: a failed migration must stop the release rather than
    # start an app against a schema it does not match.
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT

    # One worker only. `ReplayGuard` in app/security/telegram_auth.py is an
    # in-memory dict, so a second worker would have its own copy and a replayed
    # initData could land on the process that has not seen it. Move the guard
    # to Redis before raising this.
    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"

      # Wired automatically from the database above. config.py rewrites the
      # postgresql:// prefix to postgresql+asyncpg:// on load.
      - key: DATABASE_URL
        fromDatabase:
          name: sga-db
          property: connectionString

      # Only ever read by our own HS256 signing, so any charset is fine here.
      - key: JWT_SECRET
        generateValue: true

      # NOT generateValue. Telegram's `secret_token` accepts only A-Z, a-z,
      # 0-9, `_` and `-`; Render generates base64, whose `+`, `/` and `=` are
      # rejected by setWebhook at boot. Generate it yourself with
      #   python -c "import secrets; print(secrets.token_urlsafe(32))"
      # which emits precisely the allowed alphabet.
      - key: WEBHOOK_SECRET
        sync: false

      # Prompted at deploy time. Never stored in git.
      - key: BOT_TOKEN
        sync: false
      - key: MINIAPP_URL
        sync: false
      # Both Telegram Web App origins call this API directly.
      - key: ALLOWED_ORIGINS
        value: https://sga-miniapp.vercel.app,https://sga-test-game.vercel.app

      # Must match this service's real URL exactly — it is what gets registered
      # with Telegram as the webhook. If you rename the service, change this.
      #
      # Note the `-v924` suffix. onrender.com subdomains are globally unique, so
      # Render appended it when it found `sga-api` already taken. Telegram will
      # accept a webhook registration pointing anywhere, including a domain
      # belonging to someone else, so a stale value here fails silently: the
      # startup log reads "Webhook registered" and the bot never responds.
      - key: PUBLIC_API_URL
        value: https://sga-api-v924.onrender.com

      - key: ENVIRONMENT
        value: production
      # 24h. Telegram reuses the original auth_date when a Mini App is
      # relaunched, so a short window rejects the return trip from a wallet app.
      - key: INITDATA_MAX_AGE
        value: "86400"

      # Off in production. The capture file contains a real user profile.
      - key: DEBUG_AUTH
        value: "0"

      # Live Gamer rewards use the funded dedicated treasury on Solana mainnet.
      - key: SOLANA_RPC_URL
        value: https://api.mainnet-beta.solana.com
      - key: REWARD_RPC_URL
        value: https://api.mainnet-beta.solana.com
      - key: GAMER_TOKEN_SYMBOL
        value: SGA
      - key: GAMER_TOKEN_MINT
        sync: false
      - key: GAMER_TREASURY_KEYPAIR
        sync: false
      - key: REWARDS_CLAIMS_ENABLED
        sync: false
      - key: REWARD_DAILY_CAP
        value: "10000"
      - key: REWARD_MIN_CLAIM
        value: "100"
